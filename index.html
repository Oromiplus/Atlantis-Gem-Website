
<script>
/* Mobile navigation */
const menuBtn = document.getElementById('menuBtn');
const nav = document.getElementById('navLinks');

if (menuBtn && nav) {
  menuBtn.addEventListener('click', () => {
    const isOpen = nav.classList.toggle('open');

    menuBtn.setAttribute('aria-expanded', String(isOpen));
    menuBtn.setAttribute(
      'aria-label',
      isOpen ? 'Close menu' : 'Open menu'
    );
    menuBtn.textContent = isOpen ? '×' : '☰';
  });

  nav.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      nav.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
      menuBtn.setAttribute('aria-label', 'Open menu');
      menuBtn.textContent = '☰';
    });
  });
}

/* Automatically update the copyright year */
const yearElement = document.getElementById('year');

if (yearElement) {
  yearElement.textContent = new Date().getFullYear();
}

/* Shipment enquiry handlers: run only on pages with the form */
const form = document.getElementById('quoteForm');
const status = document.getElementById('formStatus');
const emailBtn = document.getElementById('emailBtn');

function makeMessage() {
  const data = new FormData(form);

  return `ATLANTIS-GEM GLOBAL LOGISTICS — SHIPMENT ENQUIRY

Name: ${data.get('name')}
Business: ${data.get('business') || 'Not provided'}
Phone/WhatsApp: ${data.get('phone')}
Email: ${data.get('email') || 'Not provided'}
Service: ${data.get('service')}
Pickup & destination: ${data.get('destination')}

Shipment details:
${data.get('details')}`;
}

if (form && status) {
  form.addEventListener('submit', event => {
    event.preventDefault();

    if (!form.reportValidity()) return;

    const message = makeMessage();

    status.className = 'status show';
    status.textContent =
      'Opening WhatsApp with your prepared enquiry. Please review the message and tap Send in WhatsApp.';

    window.open(
      'https://wa.me/2347065430914?text=' +
        encodeURIComponent(message),
      '_blank',
      'noopener,noreferrer'
    );
  });

  if (emailBtn) {
    emailBtn.addEventListener('click', () => {
      if (!form.reportValidity()) return;

      const message = makeMessage();
      const subject =
        'Shipment enquiry — Atlantis-Gem Global Logistics';

      status.className = 'status show';
      status.textContent =
        'Opening your email app with a prepared enquiry. Please review and send it.';

      window.location.href =
        'mailto:atlantisgemm@yahoo.com?subject=' +
        encodeURIComponent(subject) +
        '&body=' +
        encodeURIComponent(message);
    });
  }
}
</script>
